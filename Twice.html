<style>
/* Layout concept: a calm sticky bar, a four-step path (sign in, role, subscribe, start) that opens into a listing grid; marigold appears only on prices. */
:root{
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-tamil:'Noto Sans Tamil','Latha',sans-serif;
  --bg:#F2F5F1; --surface:#FFFFFF; --surface-2:#E7EDE8; --ink:#13231E; --muted:#58695F; --line:#D3DDD6;
  --accent:#0E6B59; --accent-ink:#FFFFFF; --gold:#F2B01E; --gold-ink:#33250A;
  --good:#1B7F4B; --warn:#8F5A00; --bad:#B3261E;
  --shadow:0 1px 2px rgba(19,35,30,.06),0 10px 28px rgba(19,35,30,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613; --surface:#15201C; --surface-2:#1E2C27; --ink:#E6EFEA; --muted:#93A59D; --line:#2A3B34;
    --accent:#4FC3A8; --accent-ink:#06251D; --gold:#F2B01E; --gold-ink:#2B1F00;
    --good:#5CCB8B; --warn:#E3A63A; --bad:#FF8A80;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#15201C; --surface-2:#1E2C27; --ink:#E6EFEA; --muted:#93A59D; --line:#2A3B34;
  --accent:#4FC3A8; --accent-ink:#06251D; --gold:#F2B01E; --gold-ink:#2B1F00;
  --good:#5CCB8B; --warn:#E3A63A; --bad:#FF8A80;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;min-width:0}
h1,h2,h3{font-family:var(--font-display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-weight:800;font-size:clamp(2.3rem,6vw,3.7rem);letter-spacing:-.03em}
h2{font-weight:800;font-size:1.6rem}
h3{font-weight:600;font-size:1.1rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 0}
.hdr-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
.mark{width:26px;height:26px;border-radius:8px;background:var(--accent);position:relative;flex:none}
.mark::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--gold);right:5px;bottom:5px}
.mark::before{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--accent-ink);left:6px;top:6px;opacity:.9}
.hdr-right{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.84rem;color:var(--muted);max-width:100%}
.chip b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:16ch}

/* buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:.86rem;border-radius:8px}
.btn.block{width:100%}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:inherit}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.84rem;font-weight:600}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.field textarea{min-height:92px;resize:vertical}
.field .hint{font-size:.8rem;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row2>*{min-width:0}
.phone-in{display:flex;gap:8px}
.phone-in span{display:flex;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:0 12px;font-weight:600}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);min-width:0}
.panel.flat{box-shadow:none}
.stack{display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.note{font-size:.82rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px;margin-top:16px}
.demo{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:.88rem}
.demo b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;font-size:1.05rem}
.err{color:var(--bad);font-size:.86rem}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:start;padding-block:44px 28px}
.hero>*{min-width:0}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:14px}
.eyebrow .ta{font-family:var(--font-tamil);letter-spacing:.02em;text-transform:none;font-size:.95rem}
.lead{font-size:1.1rem;color:var(--muted);max-width:46ch;margin-top:18px}
.facts{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.facts li{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.9rem}
.facts li em{font-style:normal;background:var(--gold);color:var(--gold-ink);border-radius:6px;padding:1px 7px;margin-right:4px}

/* stepper */
.steps{display:flex;flex-wrap:wrap;gap:8px 22px;list-style:none;margin:26px 0 0;padding:0;font-size:.86rem;color:var(--muted)}
.steps li{display:flex;align-items:center;gap:8px}
.steps i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.74rem;font-weight:600}
.steps li.on{color:var(--ink);font-weight:600}
.steps li.on i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps li.done i{border-color:var(--accent);color:var(--accent)}

/* page blocks */
.page{padding-block:30px 24px}
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}
.choice>*{min-width:0}
.choice .panel{display:flex;flex-direction:column;gap:12px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}
.plans>*{min-width:0}
.plan{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.plan[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.plan .amt{font-family:var(--font-display);font-weight:800;font-size:2rem;letter-spacing:-.02em}
.plan .amt small{font-size:.9rem;font-weight:600;color:var(--muted)}
.pay{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:start}
.pay>*{min-width:0}
.qr{width:200px;height:200px;background:#fff;border-radius:12px;padding:12px;display:grid;place-items:center;overflow:hidden}
.qr img,.qr canvas{max-width:100%;height:auto}
.copyline{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.copyline code{background:var(--surface-2);border-radius:8px;padding:6px 10px;font-size:.95rem;overflow-wrap:anywhere}

/* marketplace */
.toolbar{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.search{max-width:420px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:.86rem;cursor:pointer}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.lc{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;padding:0;min-width:0}
.lc:hover{box-shadow:var(--shadow)}
.ph{display:block;aspect-ratio:4/3;background-color:var(--surface-2);position:relative;overflow:hidden;
  background-image:radial-gradient(circle,var(--line) 2px,transparent 2.6px),radial-gradient(circle,var(--line) 2px,transparent 2.6px);
  background-size:22px 22px;background-position:0 0,11px 11px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cn{position:absolute;left:12px;bottom:10px;background:var(--surface);border-radius:8px;padding:2px 10px;font-size:.78rem;font-weight:600}
.lc-body{display:flex;flex-direction:column;gap:6px;padding:12px 14px 14px}
.lc-title{font-weight:600;overflow-wrap:anywhere}
.price{align-self:flex-start;background:var(--gold);color:var(--gold-ink);font-family:var(--font-display);font-weight:800;font-size:1.15rem;border-radius:8px;padding:1px 10px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:.74rem;font-weight:600;color:var(--muted);background:var(--surface)}
.pill.good{color:var(--good);border-color:var(--good)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.empty{border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:12px}
.item{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.item>*{min-width:0}
.item .th{width:72px;height:72px;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.item .th img{width:100%;height:100%;object-fit:cover}
.item .act{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.reqs{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:10px;font-size:.88rem}
.prev{width:140px;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--surface-2);display:none}
.prev:not(:empty){display:block}
.prev img{width:100%;height:100%;object-fit:cover}

/* modal */
.mb{position:fixed;inset:0;z-index:40;background:rgba(8,14,12,.6);display:grid;place-items:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:18px;max-width:520px;width:100%;max-height:100%;overflow:auto;border:1px solid var(--line)}
.modal .ph{aspect-ratio:16/10}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:14px}

/* admin */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.tile b{display:block;font-family:var(--font-display);font-size:1.8rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;min-width:560px}
.tbl th{text-align:left;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl .acts{display:flex;gap:6px;flex-wrap:nowrap}
.check{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
h3.sec{margin:26px 0 10px}

.ftr{border-top:1px solid var(--line);margin-top:40px;padding-block:20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;font-size:.82rem;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;gap:28px;padding-block:28px 16px}
  .pay{grid-template-columns:1fr}
}
@media (max-width:560px){
  .row2,.choice,.plans{grid-template-columns:1fr}
  .item{grid-template-columns:60px 1fr}
  .item .th{width:60px;height:60px}
  .item .act{grid-column:1/-1;justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
'use strict';
var KEY='marupadi_v1', DAY=86400000;
var CATS=['Phones & tablets','Laptops & computers','Home appliances','Furniture','Books & study','Vehicles & bikes','Fashion','Other'];
var CONDS=['Like new','Good','Fair','Needs repair'];

function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function inr(n){return '₹'+Number(n).toLocaleString('en-IN');}
function fdate(t){return new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function ftime(t){return new Date(t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});}

function defaults(){
  var now=Date.now();
  function mk(t,c,cond,p,city,d){return {id:uid(),sellerId:'sample',sellerName:'Sample seller',contact:'',title:t,cat:c,cond:cond,price:p,city:city,desc:d,photo:'',status:'live',sample:true,createdAt:now};}
  return {
    users:[],session:null,subs:[],orders:[],
    listings:[
      mk('Redmi Note 10 Pro, 6GB/128GB','Phones & tablets','Good',8500,'T. Nagar, Chennai','Two years old, battery lasts a full day. Box, charger and a screen guard included.'),
      mk('Lenovo ThinkPad T480, i5, 8GB','Laptops & computers','Good',19000,'Velachery, Chennai','256GB SSD, new keyboard fitted last year. Light scratches on the lid.'),
      mk('Godrej 190L single-door fridge','Home appliances','Fair',6200,'Anna Nagar, Chennai','Cools well, runs quietly. Moving to a smaller flat, so selling.'),
      mk('Teak study table with drawer','Furniture','Good',3800,'Adyar, Chennai','4 ft table, solid teak, one lockable drawer. Pickup only.'),
      mk('TVS Jupiter 2017, 38,000 km','Vehicles & bikes','Good',34000,'Tambaram, Chennai','Second owner, papers clear, insurance valid. Serviced in September.'),
      mk('Class 12 PCM textbook set','Books & study','Like new',600,'Mylapore, Chennai','Physics, Chemistry and Maths, both volumes. No markings.')
    ],
    settings:{brand:'Twice',upiId:'9176683102@fam',monthly:50,yearly:150,pinHash:''}
  };
}
function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){var p=JSON.parse(r),d=defaults();
      p.settings=Object.assign(d.settings,p.settings||{});
      ['users','subs','orders','listings'].forEach(function(k){if(!Array.isArray(p[k]))p[k]=d[k];});
      if(!('session' in p))p.session=null;
      return p;}
  }catch(e){}
  return defaults();
}
var db=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true;}catch(e){return false;}}

var ui={authTab:'google',otp:null,otpPhone:'',otpName:'',plan:'yearly',payTab:'upi',tab:'',q:'',cat:'All',modal:null,
  adminOpen:false,adminAuthed:false,adminTab:'overview',confirmId:null,confirmReset:false,photo:''};

var app=document.getElementById('app'), toastEl=document.getElementById('toast'), tt=null;
function toast(m){toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){toastEl.classList.remove('on');},2800);}

/* ---------- data helpers ---------- */
function me(){return db.users.find(function(u){return u.id===db.session;});}
function userById(id){return db.users.find(function(u){return u.id===id;});}
function activeSub(id){
  return db.subs.filter(function(s){return s.userId===id&&s.status==='active'&&s.endAt>Date.now();}).sort(function(a,b){return b.endAt-a.endAt;})[0];
}
function pendingSub(id){return db.subs.find(function(s){return s.userId===id&&s.status==='pending';});}
function lastSub(id){return db.subs.filter(function(s){return s.userId===id;}).sort(function(a,b){return b.requestedAt-a.requestedAt;})[0];}
function planAmt(k){return k==='yearly'?db.settings.yearly:db.settings.monthly;}
function contactOf(u){return u?(u.phone?'+91 '+u.phone:u.email):'';}

/* ---------- shell ---------- */
function stepper(n){
  var names=['Sign in','Choose role','Subscribe','Start'];
  return '<ol class="steps" aria-label="Steps">'+names.map(function(t,i){
    var c=i<n?'done':(i===n?'on':'');
    return '<li class="'+c+'"><i>'+(i<n?'✓':i+1)+'</i>'+t+'</li>';}).join('')+'</ol>';
}
function shell(inner){
  var u=me(), right='';
  if(ui.adminOpen){
    right='<span class="chip"><b>Owner area</b></span>'+(ui.adminAuthed?'<button class="btn ghost sm" data-act="lock">Lock</button>':'')+'<button class="btn ghost sm" data-act="closeAdmin">Back to site</button>';
  }else if(u){
    var sub=activeSub(u.id);
    right='<span class="chip"><b>'+esc(u.name||contactOf(u))+'</b></span>';
    if(sub&&u.role){
      right+='<span class="chip">Active till <b>'+fdate(sub.endAt)+'</b></span>'+
        '<button class="btn ghost sm" data-act="switchRole">Switch to '+(u.role==='buyer'?'seller':'buyer')+'</button>';
    }
    right+='<button class="btn ghost sm" data-act="signOut">Sign out</button>';
  }
  return '<div class="wrap"><header class="hdr"><div class="hdr-in"><div class="brand"><span class="mark"></span>'+esc(db.settings.brand)+'</div><div class="hdr-right">'+right+'</div></div></header>'+
    inner+
    '<footer class="ftr"><span>© '+new Date().getFullYear()+' '+esc(db.settings.brand)+' · Preview build: sign-in and OTP are simulated</span><button class="link" data-act="openAdmin">Owner login</button></footer></div>'+
    (ui.modal&&u?modalHtml(u):'');
}

/* ---------- views ---------- */
function view(){
  if(ui.adminOpen)return shell(adminView());
  var u=me();
  if(!u)return shell(authView());
  if(!u.role)return shell(roleView());
  if(!activeSub(u.id))return shell(payView(u));
  return shell(u.role==='buyer'?buyerView(u):sellerView(u));
}

function authView(){
  var s=db.settings, g=ui.authTab==='google', form='';
  if(g){
    form='<form class="form" data-form="google" novalidate>'+

        '<div class="copyline"><code>'+esc(s.upiId)+'</code><button class="btn ghost sm" data-act="copy" data-v="'+esc(s.upiId)+'">Copy UPI ID</button></div>'+

      '<li>Host it on your own domain with a server and database. Right now each browser keeps its own data, so members, listings and payments are not shared between devices.</li>'+
      '<li>Connect real Google sign-in (a Google Cloud OAuth client ID) and an SMS OTP service. Both are simulated here.</li>'+
      '<li>Add a payment gateway such as Razorpay or Cashfree to take cards and confirm UPI payments automatically. Direct UPI to a personal ID cannot be verified by a website, so approvals are manual for now.</li>'+
      '<li>Make the owner login server-side. The PIN here only protects this browser.</li></ul></div>'+
      '<div class="panel" style="margin-top:18px"><h3 style="margin-bottom:10px">Reset preview data</h3><p class="muted small" style="margin-bottom:12px">Clears members, payments, requests and listings in this browser and restores the sample items.</p>'+
      (ui.confirmReset?'<button class="btn danger sm" data-act="resetYes">Yes, reset everything</button> <button class="btn ghost sm" data-act="resetNo">Cancel</button>':'<button class="btn danger sm" data-act="resetAsk">Reset data</button>')+'</div>';
  }
  return '<section class="page"><div class="page-head"><h2>Owner area</h2></div>'+tabs+c+'</section>';
}

/* ---------- render ---------- */
function makeQR(){
  var box=document.getElementById('qr'); if(!box)return;
  box.innerHTML='';
  if(typeof QRCode==='undefined'){box.innerHTML='<span class="small" style="color:#444;text-align:center">QR unavailable. Use the UPI ID.</span>';return;}
  try{new QRCode(box,{text:upiLink(),width:172,height:172,correctLevel:QRCode.CorrectLevel.M});}
  catch(e){box.innerHTML='<span class="small" style="color:#444">QR unavailable.</span>';}
}
function render(){app.innerHTML=view();makeQR();}
function saveRender(){if(!save())toast('Could not save in this browser. Storage may be full or blocked.');render();}

/* ---------- actions ---------- */
function signIn(o){
  var u=db.users.find(function(x){return (o.email&&x.email===o.email)||(o.phone&&x.phone===o.phone);});
  if(!u){u={id:uid(),name:o.name,email:o.email||'',phone:o.phone||'',via:o.via,role:'',createdAt:Date.now()};db.users.push(u);}
  else if(o.name&&!u.name)u.name=o.name;
  db.session=u.id;ui.otp=null;ui.tab=u.role==='seller'?'new':'browse';ui.modal=null;
  saveRender();
}
var A={
  authTab:function(el){ui.authTab=el.dataset.v;ui.otp=null;render();},
  changeNumber:function(){ui.otp=null;render();},
  setRole:function(el){var u=me();u.role=el.dataset.v;ui.tab=u.role==='seller'?'new':'browse';saveRender();},
  switchRole:function(){var u=me();u.role=u.role==='buyer'?'seller':'buyer';ui.tab=u.role==='seller'?'new':'browse';ui.modal=null;saveRender();},
  signOut:function(){db.session=null;ui.modal=null;ui.otp=null;saveRender();},
  pickPlan:function(el){ui.plan=el.dataset.v;render();},
  payTab:function(el){ui.payTab=el.dataset.v;render();},
  copy:function(el){
    var v=el.dataset.v;
    try{navigator.clipboard.writeText(v).then(function(){toast('Copied '+v);},function(){toast('Copy is not available here. Select the text and copy it.');});}
    catch(e){toast('Copy is not available here. Select the text and copy it.');}
  },
  refresh:function(){render();toast('Status checked');},
  cancelPending:function(){var u=me();db.subs=db.subs.filter(function(s){return !(s.userId===u.id&&s.status==='pending');});saveRender();},
  tab:function(el){ui.tab=el.dataset.v;render();},
  cat:function(el){ui.cat=el.dataset.v;render();},
  open:function(el){ui.modal=el.dataset.id;render();},
  closeModal:function(el,e){if(el.dataset.bg&&e.target!==el)return;ui.modal=null;render();},
  request:function(el){
    var u=me(),l=db.listings.find(function(x){return x.id===el.dataset.id;});
    if(!l||l.sellerId===u.id)return;
    if(!db.orders.some(function(o){return o.listingId===l.id&&o.buyerId===u.id;}))db.orders.push({id:uid(),listingId:l.id,buyerId:u.id,createdAt:Date.now(),status:'requested'});
    saveRender();toast('Request sent. Seller contact shown below.');
  },
  toggleSold:function(el){var l=db.listings.find(function(x){return x.id===el.dataset.id;});if(l){l.status=l.status==='sold'?'live':'sold';saveRender();}},
  delAsk:function(el){ui.confirmId=el.dataset.id;render();},
  delNo:function(){ui.confirmId=null;render();},
  delYes:function(el){db.listings=db.listings.filter(function(x){return x.id!==el.dataset.id;});ui.confirmId=null;saveRender();toast('Listing deleted');},
  openAdmin:function(){ui.adminOpen=true;ui.modal=null;render();window.scrollTo(0,0);},
  closeAdmin:function(){ui.adminOpen=false;ui.adminAuthed=false;render();},
  lock:function(){ui.adminAuthed=false;render();},
  adminTab:function(el){ui.adminTab=el.dataset.v;render();},
  approve:function(el){
    var s=db.subs.find(function(x){return x.id===el.dataset.id;});
    if(!s||s.status!=='pending')return;
    var cur=activeSub(s.userId),start=Math.max(Date.now(),cur?cur.endAt:0);
    s.status='active';s.startAt=start;s.endAt=start+(s.plan==='yearly'?365:30)*DAY;s.decidedAt=Date.now();
    saveRender();toast('Approved. Member can start now.');
  },
  reject:function(el){var s=db.subs.find(function(x){return x.id===el.dataset.id;});if(s&&s.status==='pending'){s.status='rejected';s.decidedAt=Date.now();saveRender();toast('Rejected');}},
  adminDel:function(el){db.listings=db.listings.filter(function(x){return x.id!==el.dataset.id;});saveRender();toast('Listing removed');},
  resetAsk:function(){ui.confirmReset=true;render();},
  resetNo:function(){ui.confirmReset=false;render();},
  resetYes:function(){var pin=db.settings.pinHash,set=db.settings;db=defaults();db.settings=Object.assign(db.settings,set);db.settings.pinHash=pin;ui.confirmReset=false;saveRender();toast('Preview data reset');}
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var fn=A[el.dataset.act];
  if(fn)fn(el,e);
});

function v(f,n){return f.elements[n]?String(f.elements[n].value).trim():'';}
async function hashPin(p){
  var s='marupadi|'+p;
  try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}
  catch(e){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'f'+h;}
}
var F={
  google:function(f){
    var name=v(f,'uname'),email=v(f,'email').toLowerCase();
    if(name.length<2){toast('Enter your name.');return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('Enter a valid email address.');return;}
    signIn({via:'google',name:name,email:email});
  },
  phone:function(f){
    var ph=v(f,'phone'),name=v(f,'uname');
    if(!/^[6-9]\d{9}$/.test(ph)){toast('Enter a valid 10-digit mobile number.');return;}
    ui.otp=String(Math.floor(100000+Math.random()*900000));ui.otpPhone=ph;ui.otpName=name||('Member '+ph.slice(-4));render();
  },
  otp:function(f){
    if(v(f,'code')!==ui.otp){toast('That code does not match.');return;}
    signIn({via:'mobile',name:ui.otpName,phone:ui.otpPhone});
  },
  utr:function(f){
    var utr=v(f,'utr'),u=me();
    if(!/^\d{12}$/.test(utr)){toast('The transaction ID has 12 digits.');return;}
    if(db.subs.some(function(s){return s.utr===utr&&s.status!=='rejected';})){toast('This transaction ID was already submitted.');return;}
    db.subs.push({id:uid(),userId:u.id,plan:ui.plan,amount:planAmt(ui.plan),utr:utr,status:'pending',requestedAt:Date.now()});
    saveRender();
  },
  listing:function(f){
    var u=me(),title=v(f,'title'),price=parseInt(v(f,'price'),10),city=v(f,'city'),contact=v(f,'contact');
    if(title.length<3){toast('Add an item name.');return;}
    if(!(price>0&&price<=10000000)){toast('Enter a price in rupees.');return;}
    if(city.length<2){toast('Add your area and city.');return;}
    if(!/^[6-9]\d{9}$/.test(contact)){toast('Enter a valid 10-digit contact number.');return;}
    db.listings.unshift({id:uid(),sellerId:u.id,sellerName:u.name||'Seller',contact:contact,title:title,cat:v(f,'cat'),cond:v(f,'cond'),price:price,city:city,desc:v(f,'desc'),photo:ui.photo,status:'live',sample:false,createdAt:Date.now()});
    ui.photo='';ui.tab='mine';
    if(!save()){db.listings.shift();render();toast('Could not save. The photo may be too large; try without it.');return;}
    render();toast('Listing published');
  },
  adminpin:async function(f){
    var pin=v(f,'pin'),s=db.settings;
    if(!s.pinHash){
      if(pin.length<6){toast('Use at least 6 characters.');return;}
      if(pin!==v(f,'pin2')){toast('The two PINs do not match.');return;}
      s.pinHash=await hashPin(pin);ui.adminAuthed=true;saveRender();toast('Owner PIN saved');
    }else{
      var h=await hashPin(pin);
      if(h===s.pinHash){ui.adminAuthed=true;render();}else toast('Wrong PIN.');
    }
  },
  changepin:async function(f){
    var pin=v(f,'pin');
    if(pin.length<6){toast('Use at least 6 characters.');return;}
    if(pin!==v(f,'pin2')){toast('The two PINs do not match.');return;}
    db.settings.pinHash=await hashPin(pin);saveRender();toast('PIN updated');
  },
  settings:function(f){
    var brand=v(f,'brand'),upi=v(f,'upi'),m=parseInt(v(f,'monthly'),10),y=parseInt(v(f,'yearly'),10);
    if(brand.length<2){toast('Enter a company name.');return;}
    if(!/^[\w.\-]{2,}@[A-Za-z]{2,}$/.test(upi)){toast('Enter a valid UPI ID, like name@bank.');return;}
    if(!(m>0&&y>0)){toast('Enter both prices in rupees.');return;}
    db.settings.brand=brand;db.settings.upiId=upi;db.settings.monthly=m;db.settings.yearly=y;
    saveRender();toast('Settings saved');
  }
};
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');
  if(!f)return;
  e.preventDefault();
  var fn=F[f.dataset.form];
  if(fn)fn(f);
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){ui.q=t.value;var g=document.getElementById('grid');if(g)g.innerHTML=gridHtml();}
  else if(t.id==='u-utr'||t.id==='m-phone'||t.id==='m-otp'||t.id==='l-contact'||t.id==='l-price'){t.value=t.value.replace(/\D/g,'');}
});
document.addEventListener('change',function(e){
  if(e.target.id!=='photo')return;
  var f=e.target.files&&e.target.files[0];
  if(!f)return;
  if(!/^image\//.test(f.type)){toast('Choose an image file.');return;}
  var r=new FileReader();
  r.onload=function(){
    var img=new Image();
    img.onload=function(){
      var sc=Math.min(1,640/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      ui.photo=c.toDataURL('image/jpeg',0.72);
      var p=document.getElementById('photoPrev');
      if(p)p.innerHTML='<img alt="Preview of your photo" src="'+ui.photo+'">';
    };
    img.onerror=function(){toast('That image could not be read.');};
    img.src=r.result;
  };
  r.readAsDataURL(f);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.modal){ui.modal=null;render();}});

render();
})();
</script>
